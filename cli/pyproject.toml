[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atbx"
version = "0.2.0"
description = "CLI toolkit for scaffolding and running Nextflow-based data analysis pipelines"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["nextflow", "pipeline", "data-analysis", "neuroscience", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "polars>=0.20",
  "pyarrow>=14",
  "mne>=1.6",
  "mne-connectivity>=0.7",
  "mne-nirs>=0.6",
  "pyxdf>=1.16",
  "statsmodels>=0.14",
  "pingouin>=0.5",
  "neurokit2>=0.2.7",
]
authors = [
  { name = "Cagatay Özcan Jagiello Gutt" }
]

[project.urls]
Repository = "https://github.com/CagatayGutt/AnalysisToolbox"

[project.scripts]
atbx = "analysis_toolbox_cli.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
analysis_toolbox_cli = [
  "resources/templates/*.nf",
  "resources/templates/*.config",
  "resources/modules/analyzers/*.py",
  "resources/modules/processors/*.py",
  "resources/modules/readers/*.py",
  "resources/modules/utils/*.py",
  "resources/bin/*.py",
  "resources/bin/*.nf",
  "resources/utils/*.config",
  "resources/utils/*.ps1",
  "resources/utils/*.sh",
]
