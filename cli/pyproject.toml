[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atbx"
version = "0.2.0"
description = "AnalysisToolbox CLI for pipeline setup, reinjection, serving, and inspection"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "polars>=0.20",
  "pyarrow>=14",
  "mne>=1.6",
  "mne-connectivity>=0.7",
  "mne-nirs>=0.6",
  "pyxdf>=1.16",
  "statsmodels>=0.14",
  "pingouin>=0.5",
  "neurokit2>=0.2.7",
]
authors = [
  { name = "AnalysisToolbox Contributors" }
]

[project.scripts]
atbx = "analysis_toolbox_cli.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
analysis_toolbox_cli = [
  "resources/templates/*.nf",
  "resources/templates/*.config",
  "resources/modules/analyzers/*.py",
  "resources/modules/processors/*.py",
  "resources/modules/readers/*.py",
  "resources/bin/*.py",
  "resources/utils/*.nf",
  "resources/utils/*.ps1",
  "resources/utils/*.sh",
]
