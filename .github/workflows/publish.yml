name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: publish-pypi
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build package
        run: pip install build setuptools wheel ; python -m build --sdist --wheel --no-isolation

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
