[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "GitAtbx"
version = "0.1.1"
description = "Git-integrated CLI toolkit for scaffolding and running Nextflow-based data analysis pipelines"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.10"
license = "MIT"
keywords = ["nextflow", "pipeline", "data-analysis", "neuroscience", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "polars>=0.20",
  "pyarrow>=14",
  "mne>=1.6",
  "mne-connectivity>=0.7",
  "mne-nirs>=0.6",
  "pyxdf>=1.16",
  "statsmodels>=0.14",
  "pingouin>=0.5",
  "neurokit2>=0.2.7",
]
authors = [
  { name = "Cagatay Özcan Jagiello Gutt" }
]

[project.urls]
Repository = "https://github.com/CagatayGutt/AnalysisToolbox"

[project.scripts]
gitatbx = "gitatbx.cli:main"

[tool.setuptools.packages.find]
include = ["gitatbx*"]

[tool.setuptools.package-data]
gitatbx = [
  "templates/*.nf",
  "templates/*.config",
  "modules/analyzers/*.py",
  "modules/processors/*.py",
  "modules/readers/*.py",
  "modules/utils/*.py",
  "bin/*.py",
  "bin/*.nf",
  "bin/*.config",
  "utils/*.ps1",
  "utils/*.sh",
  "utils/*.py",
]
